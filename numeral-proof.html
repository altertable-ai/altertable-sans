</style></head><body><main><h1>The numeral 1 · 0.010 → 0.011</h1><p>The diagonal flag previously projected above the numeral alignment. The corrected join sits on the upper guide; the baseline and tabular advance are unchanged. Rounded figures retain their optical overshoot.</p><nav><label>Weight <select id="weight"><option>300</option><option selected>400</option><option>450</option><option>500</option><option>600</option><option>700</option></select></label><label>Style <select id="style"><option value="normal">Upright</option><option value="italic">Italic</option></select></label><a href="specimen.html">Full specimen</a></nav><p id="status" role="status">Loading fonts…</p><div class="columns"></div></main><script>
for(const [type,title] of [['before','0.010 · before'],['after','0.011 · corrected']]){const column=document.createElement('section');column.className='column '+type;const h=document.createElement('h2');h.textContent=title;column.append(h);for(const text of ['€1,234.56','€12,345.67','€8,901.23','€3,444.44','0123456789']){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 600 120');svg.setAttribute('role','img');svg.setAttribute('aria-label',text);for(const y of [48.92,95]){const line=document.createElementNS(svg.namespaceURI,'line');line.setAttribute('x1','0');line.setAttribute('x2','600');line.setAttribute('y1',y);line.setAttribute('y2',y);line.setAttribute('class','guide');svg.append(line)}const sample=document.createElementNS(svg.namespaceURI,'text');sample.setAttribute('x','8');sample.setAttribute('y','95');sample.setAttribute('font-size','64');sample.setAttribute('class','sample');sample.textContent=text;svg.append(sample);column.append(svg)}const p=document.createElement('p');p.className='sample small';p.textContent='€1,234.56 · €12,345.67 · €8,901.23 · 111,111.11';column.append(p);const dark=document.createElement('div');dark.className='dark';const text=document.createElement('p');text.className='sample';text.textContent='€1,234.56';dark.append(text);column.append(dark);document.querySelector('.columns').append(column)}
async function update(){const weight=document.querySelector('#weight').value,style=document.querySelector('#style').value;document.documentElement.style.setProperty('--weight',weight);document.documentElement.style.setProperty('--style',style);const status=document.querySelector('#status');status.textContent='Loading fonts…';try{await Promise.all(['Previous','Altertable Sans'].map(f=>document.fonts.load(`${style} ${weight} 64px "${f}"`)));if(weight!==document.querySelector('#weight').value||style!==document.querySelector('#style').value)return;status.textContent=`Both revisions loaded · ${weight} · ${style}`}catch{status.textContent='Font loading failed; comparison is unavailable.'}}
for(const select of document.querySelectorAll('select'))select.addEventListener('change',update);update();
</script></body></html>
