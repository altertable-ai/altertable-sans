<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Altertable Sans — brand specimen</title><style>
@font-face{font-family:Current;font-weight:400;font-style:normal;src:url('fonts/AltertableSansText-Regular.woff2?v=012')}
@font-face{font-family:Current;font-weight:400;font-style:italic;src:url('fonts/AltertableSansText-Italic.woff2?v=012')}
@font-face{font-family:Current;font-weight:500;font-style:normal;src:url('fonts/AltertableSansText-Medium.woff2?v=012')}
@font-face{font-family:Current;font-weight:500;font-style:italic;src:url('fonts/AltertableSansText-MediumItalic.woff2?v=012')}

*{box-sizing:border-box}body{margin:0;background:#efefeb;color:#242522;font:14px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:24px;margin:0}header p{max-width:75ch}nav{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}label{display:flex;gap:8px;align-items:center}select{font:inherit;padding:6px}.themes{display:grid;gap:24px}.theme{--bg:#fff;--ink:#22251f;--line:#d9ddd5;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:24px;min-width:0}.dark{--bg:#171c19;--ink:#edf1e9;--line:#414a43}.sample{font-family:Current,system-ui,sans-serif;font-size:var(--size,16px);font-weight:var(--weight,400);font-style:var(--style,normal);font-synthesis:none;overflow-wrap:anywhere}.sample p{margin:0 0 1em}.sample h2{font:inherit;line-height:1.15;letter-spacing:-.02em;margin:0 0 .8em}.card{border:1px solid var(--line);padding:16px;margin:16px 0}.number{font-variant-numeric:tabular-nums}.labels{display:flex;flex-wrap:wrap;gap:8px}.labels span{border:1px solid var(--line);padding:5px 9px}.rhythm{border-top:1px solid var(--line);padding-top:16px}.theme h3{font:14px system-ui,sans-serif;margin:0 0 20px}a{color:inherit}@media(max-width:700px){main{padding:12px}.theme{padding:16px}}
</style></head><body><main><header><h1>Altertable Sans · Brand specimen</h1><p>Precise, open, quietly human. Explore Altertable Sans through headlines, paragraphs, metrics, and interface labels on light and dark surfaces.</p><nav><label>Size <select id="size"><option>12</option><option>14</option><option selected>16</option><option>24</option><option>48</option></select> px</label><label>Weight <select id="weight"><option selected>400</option><option>500</option></select></label><label>Style <select id="style"><option value="normal">Upright</option><option value="italic">Italic</option></select></label><a href="specimen.html">Full specimen</a></nav><p id="status" role="status">Loading font…</p></header><div class="themes"></div></main><template id="content"><div class="sample"><h2>Keep your stack. Connect the context.</h2><p>Give agents, apps, and people the same data and definitions.</p><p>Query data where it lives or bring it into Altertable’s lakehouse. Define what it means once, so every team and tool shares the same context.</p><div class="card"><p>Usage this month</p><p class="number">0.002 · 99.95% · €1,234.56 · −12.8%</p><p>Storage · Compute · Queries</p></div><p>Il1 O0 rn m · customer_id · SELECT</p><div class="labels"><span>Query in place</span><span>Shared knowledge</span><span>Access control</span></div><p class="rhythm">clear answers · shared context · minimum revenue · modern systems · return records · office affinity</p></div></template><script>
const themes=document.querySelector('.themes');
for(const theme of ['light','dark']) {
 const section=document.createElement('section');
 section.className='theme '+theme;
 const title=document.createElement('h3');
 title.textContent=theme==='light'?'Light surface':'Dark surface';
 section.append(title,document.querySelector('#content').content.cloneNode(true));
 themes.append(section);
}
async function update(){const size=document.querySelector('#size').value,weight=document.querySelector('#weight').value,style=document.querySelector('#style').value;document.documentElement.style.setProperty('--size',size+'px');document.documentElement.style.setProperty('--weight',weight);document.documentElement.style.setProperty('--style',style);const status=document.querySelector('#status');status.textContent='Loading font…';try{const faces=await Promise.all(['Current'].map(family=>document.fonts.load(`${style} ${weight} ${size}px ${family}`)));if(size!==document.querySelector('#size').value||weight!==document.querySelector('#weight').value||style!==document.querySelector('#style').value)return;if(faces.some(face=>!face.length))throw Error('Missing font');status.textContent=`Font loaded · ${size} px · ${weight} · ${style}`}catch{status.textContent='The font could not be loaded. Refresh the page to try again.'}}
for(const select of document.querySelectorAll('select'))select.addEventListener('change',update);update();
</script></body></html>
