</style></head><body><main><header><h1>Altertable Sans · 0.009 → 0.010</h1><p>Precise, open, quietly human. Compare reading rhythm, terminals, numbers, and identifiers using the same content and settings in both revisions. Both columns load their own font files.</p><nav><label>Size <select id="size"><option>12</option><option>14</option><option selected>16</option><option>24</option><option>48</option></select> px</label><label>Weight <select id="weight"><option selected>400</option><option>450</option><option>500</option></select></label><label>Style <select id="style"><option value="normal">Upright</option><option value="italic">Italic</option></select></label><a href="specimen.html">Full specimen</a></nav><p id="status" role="status">Loading comparison fonts…</p></header><div class="themes"></div></main><template id="content"><div class="sample"><h2>Keep your stack. Connect the context.</h2><p>Give agents, apps, and people the same data and definitions.</p><p>Query data where it lives or bring it into Altertable’s lakehouse. Define what it means once, so every team and tool shares the same context.</p><div class="card"><p>Usage this month</p><p class="number">0.002 · 99.95% · €1,234.56 · −12.8%</p><p>Storage · Compute · Queries</p></div><p>Il1 O0 rn m · customer_id · SELECT</p><div class="labels"><span>Query in place</span><span>Shared knowledge</span><span>Access control</span></div><p class="rhythm">clear answers · shared context · minimum revenue · modern systems · return records · office affinity</p></div></template><script>
const themes=document.querySelector('.themes');
for(const theme of ['light','dark']){const section=document.createElement('section');section.className='theme '+theme;const title=document.createElement('h3');title.textContent=theme==='light'?'Light surface':'Dark surface';const columns=document.createElement('div');columns.className='columns';for(const [className,label]of [['previous','0.009 · before'],['current','0.010 · current']]){const column=document.createElement('div');column.className=className;const heading=document.createElement('p');heading.className='version';heading.textContent=label;column.append(heading,document.querySelector('#content').content.cloneNode(true));columns.append(column)}section.append(title,columns);themes.append(section)}
async function update(){const size=document.querySelector('#size').value,weight=document.querySelector('#weight').value,style=document.querySelector('#style').value;document.documentElement.style.setProperty('--size',size+'px');document.documentElement.style.setProperty('--weight',weight);document.documentElement.style.setProperty('--style',style);const status=document.querySelector('#status');status.textContent='Loading comparison fonts…';try{const faces=await Promise.all(['Previous','Current'].map(family=>document.fonts.load(`${style} ${weight} ${size}px ${family}`)));if(size!==document.querySelector('#size').value||weight!==document.querySelector('#weight').value||style!==document.querySelector('#style').value)return;if(faces.some(face=>!face.length))throw Error('Missing font');status.textContent=`Both revisions loaded · ${size} px · ${weight} · ${style}`}catch{status.textContent='Comparison font failed to load. Do not judge fallback text as the specimen.'}}
for(const select of document.querySelectorAll('select'))select.addEventListener('change',update);update();
</script></body></html>
