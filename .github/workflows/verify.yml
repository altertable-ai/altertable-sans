name: Verify fonts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python build.py
      - run: python verify.py
      - run: python -m unittest test_latin -v
      - run: python proof.py
      - run: python proof_latin.py
